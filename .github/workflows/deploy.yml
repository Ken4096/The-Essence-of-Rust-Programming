name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap 的 lastmod 依赖 git log，默认的 fetch-depth: 1
          # 会让所有文件都退化成同一个日期
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook, mdbook-mermaid and mdbook-katex
        run: |
          cargo install mdbook --locked --version 0.5.4 --force
          cargo install mdbook-mermaid --locked --force
          cargo install mdbook-katex --locked --force

      - name: Build and post-process
        run: make build SEO_FLAGS=--verbose

      - name: Verify idempotency
        run: make verify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
