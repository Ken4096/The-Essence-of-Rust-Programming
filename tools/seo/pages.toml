# ============================================================
# 逐页 meta description —— 键是 src/ 下的源文件名，脚本再映射到产物 html
# 目的是消灭"全站共用一句描述"这个最典型的重复元数据问题
# 新增章节忘记补数据时，脚本会退化为「从正文首段自动摘要」，不会失败
# ============================================================

[pages]

"introduction.md" = "《从本质学 Rust 编程》前言：本书的定位与适合的读者，并从内存安全、无畏并发、零成本抽象、跨平台四个方面概述 Rust 语言的核心特性。"

"1.搭建开发环境.md" = "Rust 开发环境搭建指南：在 Windows、Linux、macOS 各系统下安装 Rust 工具链，并用第一个 Hello Rust 程序验证环境配置是否正确。"

"2.变量.md" = "Rust 变量的本质：从变量值、数据类型、变量名三个角度理解变量，涵盖可变性、常量、作用域与变量遮蔽，以及二进制与位运算符基础。"

"3.数据类型.md" = "Rust 数据类型详解：整数、浮点数、布尔、字符、数组、元组、字符串、切片、引用、结构体与枚举的用法，以及数据在内存中的表示与解析规则。"

"4.流程控制.md" = "Rust 流程控制：if、if-let、let-else、match 语句，以及 loop、while、while-let、for 循环的用法与各自的适用场景。"

"5.函数.md" = "Rust 函数：函数的声明方式、参数与返回值、语句与表达式的区别，以及函数与数据类型的配合使用。"

"6.特征.md" = "Rust 特征（Trait）：特征的定义与基本使用、静态派发（impl trait）与动态派发（dyn trait）的差异，以及特征的继承。"

"7.泛型与关联类型.md" = "Rust 泛型与关联类型：泛型的基本使用与泛型约束、幽灵数据类型 PhantomData 的作用，以及关联类型的定义与使用场景。"

"8.工程化.md" = "Rust 工程化：包（Crate）、工作区（Workspace）与模块（mod）的组织方式，访问权限控制，以及大型项目的代码分层实践。"

"9.常用特征.md" = "Rust 常用特征（Trait）实战：Debug 与 Display 打印、Default 默认值、From/Into 类型转换、Clone 与 Copy、Drop 资源释放、Deref 解引用、闭包与迭代器。"

"10.错误处理.md" = "Rust 异常处理：用 Option 与 Result 表达可失败的计算，两者的使用与转换方式，以及 panic! 宏的触发时机与适用场景。"

"11.集合.md" = "Rust 标准库集合类型：动态数组 Vec、哈希表 HashMap、哈希集合 HashSet 与双向链表 LinkedList 的创建、增删改查与内存结构。"

"12.内存管理.md" = "Rust 内存管理：只读数据区、可写数据区、BSS、栈与堆的内存布局，生命周期机制、原始指针类型，以及所有权移动与自引用结构体。"

"13.文件操作.md" = "Rust 文件操作：文件路径（Path 与 PathBuf）的处理、目录的创建与遍历，以及文件的读写操作。"

"14.多线程.md" = "Rust 多线程：线程的创建与等待，生命周期不同步、数据不一致与数据竞争三类并发问题的成因，以及如何通过避免资源共享规避它们。"
