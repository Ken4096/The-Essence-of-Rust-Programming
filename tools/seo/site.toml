# ============================================================
# 站点级 SEO 常量 —— 全套标签与 sitemap 的唯一数据来源
# 换域名只需要改 site_url 一处，canonical / og:url / sitemap 自动跟随
# ============================================================

site_url = "https://the-essence-of-rust-programming.pages.dev/"

book_title = "从本质学 Rust 编程"
author = "罗升致"

# <html lang> 用连字符，og:locale 用下划线，两者不可混用
language = "zh-CN"
locale = "zh_CN"

# 兜底描述：某页在 pages.toml 中查不到、又无法从正文摘要时会用它
default_description = "从本质出发，深入理解 Rust 编程的核心概念与实现机制"

# 社交分享图（建议 1200x630）。放到 src/img/ 下会被 mdBook 原样复制到 web/img/。
# 文件不存在时脚本会整组省略 og:image，绝不输出指向 404 的标签。
og_image = "img/og-cover.png"


# ------------------------------------------------------------
# 搜索引擎站点验证码：在各站长平台拿到后填进来，留空则该条不输出
# ------------------------------------------------------------
[verification]
google = ""   # -> <meta name="google-site-verification">
bing = ""     # -> <meta name="msvalidate.01">
baidu = ""    # -> <meta name="baidu-site-verification">
